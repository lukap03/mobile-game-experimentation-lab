<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Uncertainty-aware rollout projection</title>
<desc id="desc">For one million comparable players, projected incremental D7 retained players are 68,704 with interval 55,306 to 82,465. Revenue change is 37,859 dollars with interval negative 90,766 to positive 164,686.</desc>
<rect width="900" height="500" fill="#ffffff"/>
<text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Uncertainty-aware rollout projection</text>
<text x="450" y="70" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">1,000,000 comparable players · 2,000 bootstrap simulations</text>
<rect x="70" y="115" width="360" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="470" y="115" width="360" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="250" y="155" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Incremental D7 retained players</text>
<text x="250" y="230" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#2563eb">+68,704</text>
<line x1="145" y1="285" x2="355" y2="285" stroke="#2563eb" stroke-width="6"/><line x1="145" y1="270" x2="145" y2="300" stroke="#2563eb" stroke-width="4"/><line x1="355" y1="270" x2="355" y2="300" stroke="#2563eb" stroke-width="4"/><circle cx="250" cy="285" r="10" fill="#2563eb"/>
<text x="250" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">95% interval: +55,306 to +82,465</text>
<text x="250" y="375" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">P(positive) = 100%</text>
<text x="650" y="155" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Incremental D7 revenue</text>
<text x="650" y="230" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#16a34a">+$37,859</text>
<line x1="545" y1="285" x2="755" y2="285" stroke="#16a34a" stroke-width="6"/><line x1="545" y1="270" x2="545" y2="300" stroke="#ef4444" stroke-width="4"/><line x1="755" y1="270" x2="755" y2="300" stroke="#16a34a" stroke-width="4"/><circle cx="650" cy="285" r="10" fill="#16a34a"/>
<text x="650" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">95% interval: −$90,766 to +$164,686</text>
<text x="650" y="375" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#ca8a04">P(positive) = 71.4%</text>
<text x="450" y="465" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">Synthetic-data illustration; uncertainty intervals are not forecasts for a real game.</text>
</svg>