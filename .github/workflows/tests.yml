name: Tests and reproducible analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  analysis:
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run the complete deterministic analysis
        run: python -m src.run_analysis
      - name: Upload verified metrics and figures
        uses: actions/upload-artifact@v4
        with:
          name: verified-analysis-output
          path: |
            reports/metrics.json
            reports/segment_analysis.csv
            reports/figures/*.svg
          if-no-files-found: error
